# Versions resolved from Google Maven / Maven Central metadata on 2026-09-07.
# Do not bump by guesswork - re-query maven-metadata.xml.
[versions]
agp = "9.4.0"
kotlin = "2.4.20"
ksp = "2.3.11"          # KSP decoupled from Kotlin versions at 2.3.0

# Wear Compose - material3 shares the 1.6.2 train with foundation/navigation.
wearCompose = "1.6.2"
composeBom = "2026.08.00"

wearTiles = "1.6.2"
protolayout = "1.4.2"
wearOngoing = "1.1.0"
wearCore = "1.4.0"
watchfaceComplications = "1.3.0"

room = "2.8.4"
work = "2.11.2"
datastore = "1.2.0"
tink = "1.18.0"

retrofit = "3.0.0"
okhttp = "5.1.0"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"

playServicesWearable = "19.0.0"

androidxCore = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"

junit = "4.13.2"
mockk = "1.14.2"
turbine = "1.2.1"

[libraries]
# --- Wear UI ---
wear-compose-material3   = { module = "androidx.wear.compose:compose-material3",  version.ref = "wearCompose" }
wear-compose-foundation  = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation  = { module = "androidx.wear.compose:compose-navigation", version.ref = "wearCompose" }
wear-compose-tooling     = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wearCompose" }
wear-core                = { module = "androidx.wear:wear",                        version.ref = "wearCore" }
wear-ongoing             = { module = "androidx.wear:wear-ongoing",                version.ref = "wearOngoing" }
wear-tiles               = { module = "androidx.wear.tiles:tiles",                 version.ref = "wearTiles" }
wear-tiles-material      = { module = "androidx.wear.protolayout:protolayout-material3", version.ref = "protolayout" }
protolayout              = { module = "androidx.wear.protolayout:protolayout",     version.ref = "protolayout" }
protolayout-expression   = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayout" }
watchface-complications  = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "watchfaceComplications" }

# --- Compose core (BOM-managed) ---
compose-bom              = { module = "androidx.compose:compose-bom",     version.ref = "composeBom" }
compose-ui               = { module = "androidx.compose.ui:ui" }
compose-ui-tooling       = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3        = { module = "androidx.compose.material3:material3" }

# --- Networking ---
retrofit                 = { module = "com.squareup.retrofit2:retrofit",  version.ref = "retrofit" }
retrofit-kotlinx-json    = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp                   = { module = "com.squareup.okhttp3:okhttp",      version.ref = "okhttp" }
okhttp-logging           = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver     = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }
kotlinx-serialization    = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# --- Persistence ---
room-runtime             = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                 = { module = "androidx.room:room-ktx",     version.ref = "room" }
room-compiler            = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing             = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences    = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
tink-android             = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# --- Background work / phone-watch ---
work-runtime             = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing             = { module = "androidx.work:work-testing",     version.ref = "work" }
play-services-wearable   = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

# --- Platform ---
androidx-core-ktx        = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose         = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# --- Test ---
junit                    = { module = "junit:junit", version.ref = "junit" }
mockk                    = { module = "io.mockk:mockk", version.ref = "mockk" }
turbine                  = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
android-library      = { id = "com.android.library",     version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler     = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp", version.ref = "ksp" }
